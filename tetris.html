<!doctype html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>테트리스</title>
<style>
  :root{
    --bg: #f7f2e7;
    --panel: #fffdf8;
    --panel-2: #efe6d3;
    --line: #d9cfb6;
    --text: #26241c;
    --muted: #6f6653;
    --accent: #e0a52c;
    --accent-deep: #9c6a0a;
    --accent-ink: #2a1c00;
    --danger: #c92a2a;
    --grid-line: rgba(38,36,28,0.08);
    --ghost: rgba(38,36,28,0.28);
    --overlay-bg: rgba(24,20,12,0.90);
    --overlay-text: #faf5ea;
    --overlay-muted: #cdc3ab;
    --i: #1f9aa8;
    --o: #d9a400;
    --t: #7d3fa8;
    --s: #2f9e44;
    --z: #d1352b;
    --j: #3457c9;
    --l: #d9640c;
    --level-accent: #d9cfb6;
  }
  html, body{
    height: 100%;
    margin: 0;
  }
  body{
    background: var(--bg);
    color: var(--text);
    font-family: 'Nunito', -apple-system, 'Segoe UI', Roboto, 'Malgun Gothic', 'Apple SD Gothic Neo', sans-serif;
    display: flex;
    flex-direction: column;
    -webkit-tap-highlight-color: transparent;
    user-select: none;
    overflow: hidden;
    padding-top: env(safe-area-inset-top, 0px);
    padding-bottom: env(safe-area-inset-bottom, 0px);
  }
  * { box-sizing: border-box; }

  h1.brand{
    font-family: 'Baloo 2', 'Nunito', 'Malgun Gothic', sans-serif;
    font-size: 19px;
    font-weight: 800;
    margin: 0;
    letter-spacing: 0.3px;
    color: var(--accent-deep);
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }

  .app{
    flex: 1;
    display: flex;
    flex-direction: column;
    min-height: 0;
    padding: 10px 12px calc(10px + env(safe-area-inset-bottom, 0px));
    gap: 8px;
  }

  header{
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 8px;
    flex: none;
    min-width: 0;
  }

  .stats-box{
    background: var(--panel);
    border: 1px solid var(--line);
    border-radius: 12px;
    padding: 8px;
    display: flex;
    flex-direction: column;
    gap: 10px;
  }
  .stat-item{
    text-align: center;
    background: var(--panel-2);
    border-radius: 10px;
    padding: 7px 4px;
  }
  .stat-item .label{
    font-size: 10px;
    color: var(--muted);
    font-weight: 700;
    letter-spacing: 0.3px;
  }
  .stat-item .value{
    font-size: 18px;
    font-weight: 800;
    font-variant-numeric: tabular-nums;
    line-height: 1.2;
  }
  .stat-item .best-line{
    font-size: 9px;
    color: var(--muted);
    font-weight: 700;
    margin-top: 1px;
    font-variant-numeric: tabular-nums;
  }

  .board-area{
    flex: 1;
    min-height: 0;
    display: flex;
    gap: 10px;
    align-items: stretch;
    justify-content: center;
  }

  .board-wrap{
    position: relative;
    display: flex;
    align-items: center;
    justify-content: center;
    min-width: 0;
    min-height: 0;
    flex: 1;
  }
  canvas#board{
    background: var(--panel);
    border: 3px solid var(--level-accent);
    border-radius: 10px;
    display: block;
    transition: border-color 0.4s ease;
  }

  .side{
    display: flex;
    flex-direction: column;
    gap: 8px;
    width: 100px;
    flex: none;
  }
  .next-box{
    background: var(--panel);
    border: 2px solid var(--level-accent);
    border-radius: 12px;
    padding: 8px;
    text-align: center;
    transition: border-color 0.4s ease;
  }
  .next-box .label{
    font-size: 11px;
    color: var(--muted);
    font-weight: 700;
    margin-bottom: 4px;
  }
  canvas#next{
    width: 64px;
    height: 64px;
    display: block;
    margin: 0 auto;
  }

  .icon-btn{
    background: var(--panel);
    border: 1px solid var(--line);
    border-radius: 12px;
    color: var(--text);
    font-size: 22px;
    width: 44px;
    height: 44px;
    display: flex;
    align-items: center;
    justify-content: center;
    flex: none;
  }
  .icon-btn:active{ background: var(--panel-2); }
  .icon-btn.speed-btn{
    width: auto;
    min-width: 58px;
    padding: 0 10px;
    font-size: 13px;
    font-weight: 800;
    color: var(--accent-deep);
    white-space: nowrap;
  }

  .controls{
    flex: none;
    display: flex;
    flex-direction: column;
    gap: 8px;
  }
  .controls-row{
    display: flex;
    gap: 8px;
  }
  .ctrl-btn{
    touch-action: manipulation;
    flex: 1;
    background: var(--panel);
    border: 1px solid var(--line);
    border-radius: 16px;
    color: var(--text);
    font-size: 30px;
    font-weight: 700;
    height: 64px;
    display: flex;
    align-items: center;
    justify-content: center;
    touch-action: manipulation;
  }
  .ctrl-btn:active{
    background: var(--panel-2);
    transform: scale(0.96);
  }
  .ctrl-btn.wide{ font-size: 17px; font-weight: 800; }
  .ctrl-btn.rotate{ color: var(--accent-deep); }
  .ctrl-btn.drop{ color: var(--danger); }

  .overlay{
    position: absolute;
    inset: 0;
    background: var(--overlay-bg);
    border-radius: 10px;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 14px;
    text-align: center;
    padding: 20px;
    z-index: 5;
  }
  .overlay h2{
    font-family: 'Baloo 2', 'Malgun Gothic', sans-serif;
    font-size: 26px;
    margin: 0;
    color: var(--accent);
  }
  .overlay p{
    margin: 0;
    color: var(--overlay-muted);
    font-size: 15px;
    line-height: 1.5;
  }
  #levelUpOverlay{ z-index: 6; }
  #levelUpOverlay h2{ font-size: 28px; }
  #levelUpOverlay .sub{
    color: var(--overlay-text);
    font-size: 18px;
    font-weight: 800;
  }
  .big-btn{
    background: var(--accent);
    color: var(--accent-ink);
    border: none;
    border-radius: 14px;
    padding: 14px 32px;
    font-size: 18px;
    font-weight: 800;
    font-family: inherit;
  }
  .big-btn:active{ opacity: 0.85; }

  .secondary-btn{
    background: rgba(255,255,255,0.08);
    border: 1px solid rgba(255,255,255,0.25);
    color: var(--overlay-text);
    border-radius: 12px;
    padding: 9px 20px;
    font-size: 14px;
    font-weight: 700;
    font-family: inherit;
  }
  .secondary-btn:active{ opacity: 0.8; }

  .speed-row{
    display: flex;
    gap: 8px;
    margin-top: 6px;
  }
  .speed-choice{
    background: rgba(255,255,255,0.08);
    border: 1px solid rgba(255,255,255,0.2);
    border-radius: 10px;
    color: var(--overlay-text);
    padding: 8px 14px;
    font-size: 14px;
    font-weight: 700;
    font-family: inherit;
  }
  .speed-choice.active{
    background: var(--accent);
    color: var(--accent-ink);
    border-color: var(--accent);
  }
  .info-line{
    color: var(--overlay-muted);
    font-size: 13px;
    font-weight: 700;
    line-height: 1.5;
  }

  .badge-toast{
    position: absolute;
    top: 12px;
    left: 50%;
    transform: translateX(-50%) translateY(-10px);
    background: var(--accent);
    color: var(--accent-ink);
    padding: 8px 18px;
    border-radius: 999px;
    font-weight: 800;
    font-size: 13px;
    box-shadow: 0 4px 14px rgba(0,0,0,0.25);
    z-index: 9;
    opacity: 0;
    transition: opacity 0.25s ease, transform 0.25s ease;
    pointer-events: none;
    white-space: nowrap;
    max-width: calc(100% - 24px);
    overflow: hidden;
    text-overflow: ellipsis;
  }
  .badge-toast.show{
    opacity: 1;
    transform: translateX(-50%) translateY(0);
  }

  .tool-grid{
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 6px;
  }
  .tool-grid .icon-btn{
    width: 100%;
    height: 44px;
    font-size: 20px;
  }
  .tool-grid .icon-btn.speed-btn{
    min-width: 0;
    padding: 0;
    font-size: 12px;
  }
  canvas#board{
    touch-action: none;
    cursor: grab;
  }

  /* 게임판을 더 크게: 여백과 오른쪽 패널 폭 축소 */
  .app{ padding: 8px 8px calc(8px + env(safe-area-inset-bottom, 0px)); }
  .board-area{ gap: 8px; }
  .side{ width: 84px; gap: 6px; }
  .next-box{ padding: 6px 4px; }
  .stats-box{ padding: 6px; gap: 6px; }
  .stat-item .value{ font-size: 16px; }
  .overlay{ padding: 16px 12px; }
  .overlay h2{ word-break: keep-all; line-height: 1.25; }
  #startOverlay h2{ font-size: 22px; }
  .speed-choice{ white-space: nowrap; padding: 8px 10px; }
  .secondary-btn{ white-space: nowrap; }

  /* 세로로 긴 화면: 정보 패널을 게임판 위로 올려 게임판을 화면 폭 가득 */
  .app.top-layout .board-area{ flex-direction: column; }
  .app.top-layout .side{
    order: -1;
    width: 100%;
    flex-direction: row;
    align-items: stretch;
    gap: 6px;
  }
  .app.top-layout .tool-grid{ width: 84px; flex: none; gap: 4px; }
  .app.top-layout .tool-grid .icon-btn{ height: 36px; font-size: 17px; }
  .app.top-layout .tool-grid .icon-btn.speed-btn{ font-size: 11px; }
  .app.top-layout .next-box{
    flex: none; width: 70px; padding: 4px;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
  }
  .app.top-layout .next-box .label{ margin-bottom: 2px; font-size: 10px; }
  .app.top-layout .next-box canvas#next{ width: 48px; height: 48px; }
  .app.top-layout .stats-box{ flex: 1; flex-direction: row; padding: 4px; gap: 4px; min-width: 0; }
  .app.top-layout .stat-item{
    flex: 1; min-width: 0; padding: 4px 2px;
    display: flex; flex-direction: column; justify-content: center;
  }
  .app.top-layout .stat-item .value{ font-size: 16px; }
  .app.top-layout .stat-item .best-line{ font-size: 8.5px; white-space: nowrap; }

  .goal-badge{
    background: rgba(224,165,44,0.16);
    border: 2px dashed var(--accent);
    color: var(--overlay-text);
    border-radius: 18px;
    padding: 8px 14px;
    font-size: 15px;
    font-weight: 800;
    word-break: keep-all;
    line-height: 1.4;
    animation: goalPop 0.5s ease-out, goalBounce 1.6s ease-in-out 0.5s infinite;
  }
  .goal-badge b{ color: var(--accent); font-size: 19px; }
  @keyframes goalPop{
    0%{ transform: scale(0.6); opacity: 0; }
    70%{ transform: scale(1.08); opacity: 1; }
    100%{ transform: scale(1); }
  }
  @keyframes goalBounce{
    0%, 100%{ transform: translateY(0); }
    50%{ transform: translateY(-4px); }
  }
  @media (prefers-reduced-motion: reduce){ .goal-badge{ animation: none; } }

  .lines-box{ position: relative; overflow: visible; }
  .lines-box .value{ color: var(--accent-deep); font-size: 22px; }
  .lines-box.hit{ animation: linesHit 0.6s ease-out; }
  .lines-box.hit .value{ animation: linesNum 0.6s ease-out; }
  @keyframes linesHit{
    0%{ background: var(--accent); transform: scale(1); }
    30%{ background: var(--accent); transform: scale(1.12); box-shadow: 0 0 0 4px rgba(224,165,44,0.35); }
    100%{ background: var(--panel-2); transform: scale(1); box-shadow: 0 0 0 0 rgba(224,165,44,0); }
  }
  @keyframes linesNum{
    0%{ color: var(--accent-ink); transform: scale(1.5); }
    100%{ color: var(--accent-deep); transform: scale(1); }
  }
  .lines-pop{
    position: absolute;
    left: 50%;
    top: 30%;
    transform: translateX(-50%);
    color: var(--danger);
    font-weight: 900;
    font-size: 16px;
    white-space: nowrap;
    pointer-events: none;
    text-shadow: 0 1px 0 #fff, 0 0 6px #fff;
    animation: linesPop 0.9s ease-out forwards;
    z-index: 3;
  }
  @keyframes linesPop{
    0%{ opacity: 0; transform: translate(-50%, 6px) scale(0.8); }
    20%{ opacity: 1; transform: translate(-50%, -4px) scale(1.15); }
    100%{ opacity: 0; transform: translate(-50%, -30px) scale(1); }
  }
  .app.top-layout .lines-box .value{ font-size: 20px; }
  @media (prefers-reduced-motion: reduce){
    .lines-box.hit, .lines-box.hit .value, .lines-pop{ animation-duration: 0.01s; }
  }

  .board-pop{
    position: absolute;
    left: 50%;
    top: 38%;
    transform: translate(-50%, -50%);
    text-align: center;
    pointer-events: none;
    z-index: 4;
    white-space: nowrap;
  }
  .board-pop .pop-title{
    font-weight: 900;
    font-size: 34px;
    color: var(--accent);
    text-shadow: -2px -2px 0 #fff, 2px -2px 0 #fff, -2px 2px 0 #fff, 2px 2px 0 #fff, 0 5px 0 var(--accent-deep);
  }
  .board-pop .pop-sub{
    margin-top: 4px;
    font-weight: 900;
    font-size: 18px;
    color: var(--accent-deep);
    text-shadow: 0 0 6px #fff, 0 0 10px #fff;
  }
  .board-pop.combo.show{ animation: popCombo 0.9s ease-out forwards; }
  .board-pop.tetris .pop-title{
    font-size: 46px;
    background: linear-gradient(90deg, #e04b3a, #e0a52c, #3aa655, #2f8fd8, #8a4fd8);
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
    text-shadow: none;
    filter: drop-shadow(2px 2px 0 #fff) drop-shadow(-2px -2px 0 #fff) drop-shadow(0 4px 0 rgba(0,0,0,0.25));
  }
  .board-pop.tetris.show{ animation: popTetris 1.3s ease-out forwards; }
  @keyframes popCombo{
    0%{ opacity: 0; transform: translate(-50%, -50%) scale(0.5); }
    20%{ opacity: 1; transform: translate(-50%, -50%) scale(1.15); }
    35%{ transform: translate(-50%, -50%) scale(1); }
    75%{ opacity: 1; transform: translate(-50%, -60%) scale(1); }
    100%{ opacity: 0; transform: translate(-50%, -80%) scale(0.95); }
  }
  @keyframes popTetris{
    0%{ opacity: 0; transform: translate(-50%, -50%) scale(0.3) rotate(-8deg); }
    18%{ opacity: 1; transform: translate(-50%, -50%) scale(1.25) rotate(3deg); }
    30%{ transform: translate(-50%, -50%) scale(1) rotate(0); }
    80%{ opacity: 1; transform: translate(-50%, -52%) scale(1.03); }
    100%{ opacity: 0; transform: translate(-50%, -70%) scale(1); }
  }
  .board-wrap.shake canvas#board{ animation: boardShake 0.45s ease-out; }
  @keyframes boardShake{
    0%{ transform: translate(0,0); }
    15%{ transform: translate(-7px, 3px); }
    30%{ transform: translate(6px, -4px); }
    45%{ transform: translate(-5px, 2px); }
    60%{ transform: translate(4px, -2px); }
    75%{ transform: translate(-2px, 1px); }
    100%{ transform: translate(0,0); }
  }
  @media (prefers-reduced-motion: reduce){
    .board-wrap.shake canvas#board{ animation: none; }
  }

  canvas#hold{ width: 64px; height: 64px; display: block; margin: 0 auto; }
  .hold-box{ cursor: pointer; }
  .hold-box.used canvas{ opacity: 0.35; }
  .hold-box.flash{ animation: holdFlash 0.35s ease-out; }
  @keyframes holdFlash{
    0%{ transform: scale(1); } 40%{ transform: scale(1.08); background: var(--panel-2); } 100%{ transform: scale(1); }
  }
  .app.top-layout .next-box{ width: 54px; }
  .app.top-layout .next-box canvas#next,
  .app.top-layout .next-box canvas#hold{ width: 42px; height: 42px; }
  .app.top-layout .next-box .label{ font-size: 9.5px; white-space: nowrap; }
  .app.top-layout .stat-item .value{ font-size: 15px; }
  .app.top-layout .stat-item .label{ font-size: 10px; }
  .board-pop.perfect .pop-title{
    font-size: 40px;
    color: var(--accent);
    text-shadow: -2px -2px 0 #fff, 2px -2px 0 #fff, -2px 2px 0 #fff, 2px 2px 0 #fff, 0 5px 0 var(--accent-deep), 0 0 24px rgba(224,165,44,0.8);
  }
  .board-pop.perfect.show{ animation: popTetris 1.4s ease-out forwards; }
  .garbage-note{ color: #ff9d7a; font-weight: 800; }

  .board-col{
    flex: 1;
    min-width: 0;
    min-height: 0;
    display: flex;
    flex-direction: column;
    gap: 4px;
  }
  .best-bar{
    flex: none;
    text-align: center;
    font-size: 15px;
    font-weight: 900;
    color: var(--text);
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
    line-height: 1.3;
  }
  .best-bar b{ color: var(--accent-deep); font-size: 17px; }
  .best-bar .dot{ margin: 0 8px; color: var(--muted); }

  /* ---------- 지갑·아이템·상점 ---------- */
  .best-bar{ display: flex; align-items: center; justify-content: center; gap: 8px; }
  .best-text{ overflow: hidden; text-overflow: ellipsis; min-width: 0; }
  .item-btn{
    flex: none; position: relative;
    height: 30px; min-width: 40px; padding: 0 8px;
    border-radius: 10px; border: 2px solid var(--accent);
    background: var(--panel); font-size: 17px; font-family: inherit; line-height: 1;
  }
  .item-btn:active{ transform: scale(0.95); }
  .item-btn .item-count{
    position: absolute; top: -7px; right: -7px;
    min-width: 18px; height: 18px; padding: 0 4px; border-radius: 9px;
    background: var(--danger); color: #fff; font-size: 11px; font-weight: 900;
    display: flex; align-items: center; justify-content: center;
  }
  .item-btn .item-count.zero{ background: var(--muted); }
  .slow-chip{
    flex: none; font-size: 13px; font-weight: 900; color: #1b7a4a;
    background: #dff5e8; border-radius: 10px; padding: 3px 8px;
  }
  .wallet-line{ color: var(--overlay-text); font-size: 15px; font-weight: 700; }
  .wallet-line b{ color: var(--accent); font-size: 18px; }
  .earn-box{
    color: var(--overlay-text); font-size: 14px; line-height: 1.7;
    background: rgba(255,255,255,0.08); border-radius: 12px; padding: 10px 16px; min-width: 200px;
  }
  .earn-box .row{ display: flex; justify-content: space-between; gap: 16px; }
  .earn-box .total{ border-top: 1px solid rgba(255,255,255,0.2); margin-top: 4px; padding-top: 4px; font-weight: 900; color: var(--accent); font-size: 16px; }
  .money-pop{
    position: absolute; left: 50%; top: 12px; transform: translateX(-50%);
    background: var(--accent); color: var(--accent-ink); font-weight: 900; font-size: 14px;
    border-radius: 999px; padding: 5px 14px; z-index: 4; pointer-events: none; white-space: nowrap;
    box-shadow: 0 3px 10px rgba(0,0,0,0.15);
  }
  .money-pop.show{ animation: moneyPop 1.4s ease-out forwards; }
  @keyframes moneyPop{
    0%{ opacity: 0; transform: translate(-50%, 8px) scale(0.8); }
    15%{ opacity: 1; transform: translate(-50%, 0) scale(1.08); }
    25%{ transform: translate(-50%, 0) scale(1); }
    80%{ opacity: 1; }
    100%{ opacity: 0; transform: translate(-50%, -10px); }
  }
  .hammer-hint{
    position: absolute; left: 50%; top: 10px; transform: translateX(-50%);
    background: #2b2418; color: #fff; font-weight: 800; font-size: 14px;
    border-radius: 999px; padding: 6px 8px 6px 14px; z-index: 4; white-space: nowrap;
    display: flex; align-items: center; gap: 8px;
    animation: goalBounce 1.2s ease-in-out infinite;
  }
  .hammer-hint button{
    border: none; border-radius: 999px; padding: 4px 10px; font-family: inherit; font-weight: 800;
    background: rgba(255,255,255,0.2); color: #fff;
  }
  .overlay.shop-overlay{ justify-content: flex-start; gap: 10px; overflow-y: auto; }
  .shop-tabs{ display: flex; gap: 6px; }
  .shop-tab{
    border: 1px solid rgba(255,255,255,0.25); background: rgba(255,255,255,0.06);
    color: var(--overlay-muted); border-radius: 999px; padding: 6px 12px;
    font-family: inherit; font-weight: 800; font-size: 13px; white-space: nowrap;
  }
  .shop-tab.active{ background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
  .shop-list{ width: 100%; display: flex; flex-direction: column; gap: 8px; }
  .shop-row{
    display: flex; align-items: center; gap: 10px; text-align: left;
    background: rgba(255,255,255,0.08); border-radius: 12px; padding: 8px 10px;
    color: var(--overlay-text);
  }
  .shop-row .ico{ font-size: 26px; width: 34px; text-align: center; flex: none; }
  .shop-row canvas{ width: 34px; height: 34px; flex: none; border-radius: 6px; }
  .shop-row .info{ flex: 1; min-width: 0; }
  .shop-row .name{ font-weight: 900; font-size: 14px; }
  .shop-row .desc{ font-size: 11.5px; color: var(--overlay-muted); line-height: 1.35; word-break: keep-all; }
  .shop-row .buy{

<script>
(function(){
  "use strict";

  var PLAYER_NAME = (function(){ var n = ''; try { var h = decodeURIComponent((location.hash || '').slice(1)).trim(); if (h){ localStorage.setItem('tetris_player_name', h.slice(0, 10)); history.replaceState(null, '', location.pathname + location.search); } n = localStorage.getItem('tetris_player_name') || ''; } catch(e){} return n || '플레이어'; })(); try { var _t = document.querySelector('#startOverlay h2'); if (_t) _t.textContent = PLAYER_NAME + '님의 테트리스'; } catch(e){}
  var COLS = 10, ROWS = 20;
  function getCss(name){
    return getComputedStyle(document.documentElement).getPropertyValue(name).trim();
  }
  var COLORS = {
    I: getCss('--i'), O: getCss('--o'), T: getCss('--t'),
    S: getCss('--s'), Z: getCss('--z'), J: getCss('--j'), L: getCss('--l')
  };

  var SHAPES = {
    I: [[0,1],[1,1],[2,1],[3,1]],
    O: [[1,0],[2,0],[1,1],[2,1]],
    T: [[1,0],[0,1],[1,1],[2,1]],
    S: [[1,0],[2,0],[0,1],[1,1]],
    Z: [[0,0],[1,0],[1,1],[2,1]],
    J: [[0,0],[0,1],[1,1],[2,1]],
    L: [[2,0],[0,1],[1,1],[2,1]]
  };
  var KEYS = Object.keys(SHAPES);

  var SPEED_STARTS = [1300, 650, 420];
  // 레벨마다 8%씩 빨라짐(최저 0.07초) → 어느 속도로 시작해도 끝까지 조금씩 어려워짐
  function speedForLevel(lv){
    return Math.max(70, Math.round(SPEED_STARTS[chosenSpeedIdx] * Math.pow(0.92, lv - 1)));
  }
  var SPEED_LABELS = ['느리게', '보통', '빠르게'];
  var chosenSpeedIdx = 0;
  var HISTORY_KEY = 'tetris_history';

  function fmt(n){
    try { return Number(n).toLocaleString('ko-KR'); } catch(e){ return String(n); }
  }

  var LEVEL_THEMES = ['#d9cfb6', '#8fbf8f', '#7ea6d9', '#d98fb0', '#b399e0', '#e0a96b'];
  function applyLevelTheme(lv){
    var color = LEVEL_THEMES[(lv - 1) % LEVEL_THEMES.length];
    document.documentElement.style.setProperty('--level-accent', color);
  }

  var LEVEL_UP_MESSAGES = [
    PLAYER_NAME + '님 레벨업을 축하 드립니다!',
    '역시 ' + PLAYER_NAME + '님!',
    PLAYER_NAME + '님, 최고예요!',
    '대단하세요, ' + PLAYER_NAME + '님!',
    PLAYER_NAME + '님 실력이 늘고 계세요!'
  ];

  var soundOn = true;
  var audioCtx = null;
  var scheduledNodes = [];
  var reverbConvolver = null;
  var reverbSend = null;

  function buildImpulseResponse(ctxA){
    var duration = 1.6, rate = ctxA.sampleRate, length = Math.floor(rate * duration);
    var impulse = ctxA.createBuffer(2, length, rate);
    for (var ch = 0; ch < 2; ch++){
      var data = impulse.getChannelData(ch);
      for (var i = 0; i < length; i++){
        data[i] = (Math.random() * 2 - 1) * Math.pow(1 - i / length, 2.6);
      }
    }
    return impulse;
  }
  var NOTE_FREQ = {
    A3: 220.00, G4: 392.00, A4: 440.00, B4: 493.88, C5: 523.25, D5: 587.33,
    E5: 659.25, F5: 698.46, G5: 783.99, A5: 880.00, C6: 1046.50,
    E6: 1318.51, G6: 1567.98
  };

  var masterGain = null;
  function ensureAudio(){
    if (!audioCtx){
      var AC = window.AudioContext || window.webkitAudioContext;
      if (AC) audioCtx = new AC();
    }
    if (audioCtx && audioCtx.state === 'suspended'){
      audioCtx.resume();
    }
    if (audioCtx && !masterGain){
      // 전체 음량: 처음 대비 1.1 × 1.3 = 1.43배
      masterGain = audioCtx.createGain();
      masterGain.gain.value = 1.43;
      // 큰 소리가 겹칠 때 찢어지지 않도록 리미터
      var limiter = audioCtx.createDynamicsCompressor();
      limiter.threshold.value = -3;
      limiter.knee.value = 0;
      limiter.ratio.value = 20;
      limiter.attack.value = 0.002;
      limiter.release.value = 0.1;
      masterGain.connect(limiter);
      limiter.connect(audioCtx.destination);
    }
    if (audioCtx && !reverbConvolver){
      reverbConvolver = audioCtx.createConvolver();
      reverbConvolver.buffer = buildImpulseResponse(audioCtx);
      reverbSend = audioCtx.createGain();
      reverbSend.gain.value = 0.22;
      reverbSend.connect(reverbConvolver);
      reverbConvolver.connect(masterGain);
    }
    return audioCtx;
  }

  function playTone(ctxA, freq, startTime, dur, type, peak){
    peak = peak || 0.075;
    // 효과음 팩: 기본(부드러운 음) / 8비트(게임기) / 실로폰(맑은 타악기)
    var pack = (typeof wallet !== 'undefined' && wallet && wallet.sfx) || 'basic';
    var attackT = Math.min(0.025, dur * 0.35);
    var decayT = Math.max(attackT, Math.min(0.1, dur * 0.7));
    var sustainLv = 0.55, mainType = 'triangle', harmMul = 2, harmGain = 0.22;
    if (pack === 'retro'){ peak *= 0.5; mainType = 'square'; attackT = 0.003; sustainLv = 0.8; harmGain = 0; }
    if (pack === 'xylo'){ peak *= 1.3; mainType = 'sine'; attackT = 0.002; decayT = Math.max(0.004, dur * 0.25); sustainLv = 0.25; harmMul = 4; harmGain = 0.35; }

    var voiceGain = ctxA.createGain();
    voiceGain.gain.setValueAtTime(0.0001, startTime);
    voiceGain.gain.exponentialRampToValueAtTime(peak, startTime + attackT);
    voiceGain.gain.exponentialRampToValueAtTime(Math.max(peak * sustainLv, 0.0002), startTime + decayT);
    voiceGain.gain.exponentialRampToValueAtTime(0.0001, startTime + dur);

    var osc1 = ctxA.createOscillator();
    osc1.type = mainType;
    osc1.frequency.value = freq;
    osc1.connect(voiceGain);

    var osc2 = ctxA.createOscillator();
    osc2.type = 'sine';
    osc2.frequency.value = freq * harmMul;
    var shimmerGain = ctxA.createGain();
    shimmerGain.gain.value = harmGain;
    osc2.connect(shimmerGain);
    shimmerGain.connect(voiceGain);

    voiceGain.connect(masterGain);
    if (reverbSend) voiceGain.connect(reverbSend);

    var stopAt = startTime + dur + 0.05;
    osc1.start(startTime); osc1.stop(stopAt);
    osc2.start(startTime); osc2.stop(stopAt);

    var entry = { oscs: [osc1, osc2], gain: voiceGain, ended: 0 };
    scheduledNodes.push(entry);
    function onEnd(){
      entry.ended++;
      if (entry.ended >= entry.oscs.length){
        var idx = scheduledNodes.indexOf(entry);
        if (idx !== -1) scheduledNodes.splice(idx, 1);
      }
    }
    osc1.onended = onEnd;
    osc2.onended = onEnd;
  }

  function stopAllTones(){
    if (!audioCtx) { scheduledNodes = []; return; }
    var now = audioCtx.currentTime;
    scheduledNodes.forEach(function(entry){
      try {
        entry.gain.gain.cancelScheduledValues(now);
        entry.gain.gain.setValueAtTime(entry.gain.gain.value, now);
        entry.gain.gain.linearRampToValueAtTime(0.0001, now + 0.03);
        entry.oscs.forEach(function(o){ o.stop(now + 0.04); });
      } catch(e){}
    });
    scheduledNodes = [];
  }

  function stopSound(){
    stopAllTones();
  }

  function playNoiseBurst(ctxA, startTime, dur, cutoff, peak){
    var size = Math.max(1, Math.floor(ctxA.sampleRate * dur));
    var buffer = ctxA.createBuffer(1, size, ctxA.sampleRate);
    var data = buffer.getChannelData(0);
    for (var i = 0; i < size; i++){
      data[i] = (Math.random() * 2 - 1) * Math.pow(1 - i / size, 3);
    }
    var noise = ctxA.createBufferSource();
    noise.buffer = buffer;
    var filter = ctxA.createBiquadFilter();
    filter.type = 'lowpass';
    filter.frequency.value = cutoff || 900;
    var gain = ctxA.createGain();
    gain.gain.setValueAtTime(peak || 0.16, startTime);
    gain.gain.exponentialRampToValueAtTime(0.0001, startTime + dur);
    noise.connect(filter);
    filter.connect(gain);
    gain.connect(masterGain);
    noise.start(startTime);
    noise.stop(startTime + dur + 0.02);
  }

  // 좌우 이동: 짧고 가벼운 '톡' 소리
  var lastMoveSoundAt = 0;
  function playMoveSound(){
    var ctxA = ensureAudio();
    if (!ctxA || !soundOn) return;
    var nowMs = performance.now();
    if (nowMs - lastMoveSoundAt < 35) return;
    lastMoveSoundAt = nowMs;
    var t = ctxA.currentTime + 0.005;
    var osc = ctxA.createOscillator();
    osc.type = 'sine';
    osc.frequency.setValueAtTime(1500, t);
    osc.frequency.exponentialRampToValueAtTime(700, t + 0.03);
    var g = ctxA.createGain();
    g.gain.setValueAtTime(0.0001, t);
    g.gain.exponentialRampToValueAtTime(0.09, t + 0.003);
    g.gain.exponentialRampToValueAtTime(0.0001, t + 0.045);
    osc.connect(g);
    g.connect(masterGain);
    osc.start(t);
    osc.stop(t + 0.06);
    playNoiseBurst(ctxA, t, 0.012, 4000, 0.05);
  }

  function playRotateSound(){
    var ctxA = ensureAudio();
    if (!ctxA || !soundOn) return;
    var t = ctxA.currentTime + 0.01;
    playTone(ctxA, 660, t, 0.055, null, 0.05);

  function clickTone(ctxA, f, t, d, pk, type, f2){
    var o = ctxA.createOscillator(), g = ctxA.createGain();
    o.type = type || 'sine';
    o.frequency.setValueAtTime(f, t);
    if (f2) o.frequency.exponentialRampToValueAtTime(f2, t + d);
    g.gain.setValueAtTime(0.0001, t);
    g.gain.exponentialRampToValueAtTime(pk, t + 0.004);
    g.gain.exponentialRampToValueAtTime(0.0001, t + d);
    o.connect(g); g.connect(masterGain);
    o.start(t); o.stop(t + d + 0.02);
  }
  function clickNoise(ctxA, t, d, f, pk, bandpass){
    var n = Math.floor(ctxA.sampleRate * d), b = ctxA.createBuffer(1, n, ctxA.sampleRate), x = b.getChannelData(0);
    for (var i = 0; i < n; i++) x[i] = (Math.random() * 2 - 1) * Math.pow(1 - i / n, 3);
    var src = ctxA.createBufferSource(); src.buffer = b;
    var fl = ctxA.createBiquadFilter();
    fl.type = bandpass ? 'bandpass' : 'lowpass';
    fl.frequency.value = f;
    if (bandpass) fl.Q.value = 4;
    var g = ctxA.createGain(); g.gain.value = pk;
    src.connect(fl); fl.connect(g); g.connect(masterGain);
    src.start(t);
  }

  function playLineClearSound(cleared, comboCount){

    var n = garbageRows(lv), lastHole = -1;
    for (var r = 0; r < n; r++){

      do { hole = Math.floor(Math.random() * COLS); } while (hole === lastHole);

      var rowIdx = ROWS - 1 - r;
      for (var c = 0; c < COLS; c++) grid[rowIdx][c] = (c === hole) ? null : GARBAGE_COLOR;
      var spots = [];
      for (var c2 = 0; c2 < COLS; c2++) if (c2 !== hole) spots.push(c2);

      if (st === 'coin'){ grid[rowIdx][spots[0]] = '@coin'; grid[rowIdx][spots[1]] = '@coin'; }

  function computeStreak(){

    var streak = 0;
    var cursor = new Date();
    while (true){
      var key = cursor.getFullYear() + '-' + cursor.getMonth() + '-' + cursor.getDate();

      cx.font = '600 20px sans-serif';
      cx.fillText(PLAYER_NAME + '의 테트리스', rightEdge, H - 60);

      c.toBlob(function(blob){ callback(blob); }, 'image/png');
    } catch(e){
      callback(null);
    }
  }

  function shareScore(){
    var text = PLAYER_NAME + '님의 테트리스 기록\n레벨 ' + level + ' · ' + fmt(score) + '점';
    buildScoreCardBlob(function(blob){
      if (blob && navigator.canShare && navigator.share){
        try {
          var file = new File([blob], 'tetris_score.png', { type: 'image/png' });

            navigator.share({ files: [file], title: '테트리스 기록', text: text }).catch(function(){});

          }

        try {
          navigator.clipboard.writeText(text);
          alert('점수가 복사되었습니다. 카카오톡 등에 붙여넣기 해주세요!\n\n' + text);
        } catch(e){
          alert(text);
        }
      }
    });
  }

  function applySpeed(idx){
    chosenSpeedIdx = idx;
    if (typeof level === 'number' && running){
      dropInterval = speedForLevel(level);
    }
    speedBtn.textContent = SPEED_LABELS[chosenSpeedIdx];
    document.querySelectorAll('.speed-choice').forEach(function(b){
      b.classList.toggle('active', parseInt(b.dataset.speed, 10) === chosenSpeedIdx);
    });
  }

  var appEl = document.querySelector('.app');
  var boardAreaEl = document.querySelector('.board-area');
  var TOP_BAR_H = 86;   // 위쪽 배치일 때 정보 패널 높이(대략)
  var SIDE_W = 92;      // 오른쪽 배치일 때 패널 폭 + 간격
  function chooseLayout(){
    var r = boardAreaEl.getBoundingClientRect();
    var barH = document.getElementById('bestBar').offsetHeight + 4;
    var sideCell = Math.min((r.width - SIDE_W) / COLS, (r.height - barH) / ROWS);
    var topCell = Math.min(r.width / COLS, (r.height - TOP_BAR_H - barH) / ROWS);
    appEl.classList.toggle('top-layout', topCell > sideCell + 0.5);
  }
  function resize(){
    appEl.classList.remove('top-layout');
    chooseLayout();
    var wrapRect = boardWrap.getBoundingClientRect();
    var availW = wrapRect.width;
    var availH = wrapRect.height;
    var c = Math.floor(Math.min(availW / COLS, availH / ROWS));
    if (c < 10) c = 10;
    cell = c;
    // 고해상도 화면에 맞춰 실제 화소 수만큼 그려서 선명하게
    var dpr = Math.min(window.devicePixelRatio || 1, 4);
    canvas.width = Math.round(cell * COLS * dpr);
    canvas.height = Math.round(cell * ROWS * dpr);
    canvas.style.width = (cell * COLS) + 'px';
    canvas.style.height = (cell * ROWS) + 'px';
    ctx.setTransform(canvas.width / (cell * COLS), 0, 0, canvas.height / (cell * ROWS), 0, 0);
    nextCanvas.width = Math.round(64 * dpr);
    nextCanvas.height = Math.round(64 * dpr);
    nextCtx.setTransform(nextCanvas.width / 64, 0, 0, nextCanvas.height / 64, 0, 0);
    holdCanvas.width = Math.round(64 * dpr);
    holdCanvas.height = Math.round(64 * dpr);
    holdCtx.setTransform(holdCanvas.width / 64, 0, 0, holdCanvas.height / 64, 0, 0);
    if (next) drawNext();
    drawHold();
    draw();
  }

  function newGrid(){
    var g = [];
    for (var r = 0; r < ROWS; r++){
      g.push(new Array(COLS).fill(null));
    }
    return g;
  }

  // 블록별 나오는 비율: Z를 절반으로 줄이고 그만큼 T를 더 (나머지는 그대로)
  var PIECE_WEIGHTS = { I: 1, O: 1, T: 1.5, S: 1, Z: 0.5, J: 1, L: 1 };
  function pickWeightedKey(){
    var total = 0, k;
    for (var i = 0; i < KEYS.length; i++) total += (PIECE_WEIGHTS[KEYS[i]] || 1);
    var r = Math.random() * total;
    for (var j = 0; j < KEYS.length; j++){
      k = KEYS[j];
      r -= (PIECE_WEIGHTS[k] || 1);
      if (r < 0) return k;
    }
    return k;
  }
  function randomPiece(){
    var k = pickWeightedKey();
    if (running && stageOf(level) === 'lucky' && k !== 'I' && Math.random() < 2 / 6) k = 'I';   // I블록 약 3배
    var cells = SHAPES[k].map(function(p){ return [p[0], p[1]]; });
    var w = 4;
    return { type: k, cells: cells, x: Math.floor((COLS - w) / 2), y: -1, color: COLORS[k] };
  }

  function rotateCells(cells){
    return cells.map(function(p){
      var x = p[0], y = p[1];
      var nx = 3 - y;
      var ny = x;
      return [nx, ny];
    });
  }

  function collide(cells, ox, oy){
    for (var i = 0; i < cells.length; i++){
      var x = cells[i][0] + ox;
      var y = cells[i][1] + oy;
      if (x < 0 || x >= COLS || y >= ROWS) return true;
      if (y >= 0 && grid[y][x]) return true;
    }
    return false;
  }

  function lockPiece(isHard){
    for (var i = 0; i < current.cells.length; i++){
      var x = current.cells[i][0] + current.x;
      var y = current.cells[i][1] + current.y;
      if (y < 0) { triggerGameOver(); return; }
      grid[y][x] = current.color;
    }
    // 떨어지는 소리는 줄이 안 없어질 때만 (줄이 없어지면 줄 지우기 소리만)
    var clearedNow = clearLines();
    if (!clearedNow){
      if (isHard) playHardDropSound(); else playLockSound();
    }
    current = next;
    next = randomPiece();
    drawNext();
    canHold = true;
    drawHold();
    if (collide(current.cells, current.x, current.y)){
      triggerGameOver();
    }
  }

  function triggerLevelUp(oldLevel, newLevel){
    earn(500 * newLevel, '레벨 ' + newLevel + ' 달성');
    celebrating = true;
    pendingRetryLevel = oldLevel;
    applyLevelTheme(newLevel);
    stopSound();
    setupLevelBoard(newLevel);
    draw();
    playLevelUpFanfare();
    levelUpTitle.textContent = LEVEL_UP_MESSAGES[Math.floor(Math.random() * LEVEL_UP_MESSAGES.length)];
    levelUpSub.textContent = '레벨 ' + newLevel + ' 도전 준비 완료';
    var goalEl = document.getElementById('levelUpGoal');
    var need = linesNeeded(newLevel);
    if (isSpecialLevel(newLevel)) goalEl.innerHTML = LEVEL_GOAL_SPECIAL.replace('{n}', need);
    else if (newLevel === LINES_CAP - 4) goalEl.innerHTML = LEVEL_GOAL_MAX.replace('{n}', need);
    else goalEl.innerHTML = pickGoal(LEVEL_GOAL_LINES, need);
    var stg = stageOf(newLevel);
    if (stg){
      levelUpSub.innerHTML = STAGES[stg].ico + ' 특별 레벨 ' + newLevel + ' · ' + STAGES[stg].name + '<br><span class="garbage-note">' + STAGES[stg].desc + '</span>';
    }
    var prevEl = document.getElementById('levelUpPreview');
    var nextStg = stageOf(newLevel + 1);
    if (nextStg){
      prevEl.innerHTML = '다음 레벨은 ' + STAGES[nextStg].ico + ' <b>' + STAGES[nextStg].name + '</b>!';
      prevEl.hidden = false;
    } else { prevEl.hidden = true; }
    goalEl.style.animation = 'none'; void goalEl.offsetWidth; goalEl.style.animation = '';
    levelUpOverlay.hidden = false;
    if (navigator.vibrate) navigator.vibrate([40,40,40,40,90]);
  }

  // 지워지는 줄 안의 금화·보물상자·폭탄 처리 (줄을 실제로 지우기 전에 호출)
  function handleSpecialCells(fullRows){
    var full = {}; fullRows.forEach(function(r){ full[r] = true; });
    var coins = 0, chest = false, queue = [], seen = {}, boomCells = [];
    fullRows.forEach(function(r){
      for (var c = 0; c < COLS; c++){
        var v = grid[r][c];
        if (v === '@coin') coins++;
        if (v === '@chest') chest = true;
        if (v === '@bomb'){ queue.push([r, c]); seen[r + ',' + c] = true; }
      }
    });
    var bombs = 0;
    while (queue.length){
      var b = queue.shift(); bombs++;
      for (var dr = -1; dr <= 1; dr++) for (var dc = -1; dc <= 1; dc++){
        var rr = b[0] + dr, cc = b[1] + dc;
        if (rr < 0 || rr >= ROWS || cc < 0 || cc >= COLS) continue;
        var key = rr + ',' + cc, val = grid[rr][cc];
        if (val === '@bomb' && !seen[key]){ seen[key] = true; queue.push([rr, cc]); }
        if (val === '@coin' && !full[rr]){ coins++; }
        if (val === '@chest' && !full[rr]){ chest = true; }
        if (val && !full[rr]){ grid[rr][cc] = null; }
        boomCells.push([rr, cc]);
      }
    }
    if (bombs){
      if (typeof spawnCellFx === 'function') spawnCellFx(boomCells, 'spark');
      var ctxA = ensureAudio();
      if (ctxA && soundOn){ for (var i = 0; i < Math.min(bombs, 4); i++){ playNoiseBurst(ctxA, ctxA.currentTime + 0.02 + i * 0.09, 0.3, 1100, 0.55); } }
      shakeBoard();
      if (bombs >= 2){ maxChainThisGame = Math.max(maxChainThisGame, bombs); }
      setTimeout(function(){ showBoardPop(bombs >= 2 ? '💥 연쇄 ' + bombs + '폭발!' : '💥 펑!', '주변 칸까지 날아갔어요', 'combo'); }, 50);
    }
    if (coins){
      setTimeout(function(){ earn(1000 * coins, '금화 ' + coins + '개'); }, bombs ? 700 : 0);
    }
    if (chest){
      var pool = ['bomb', 'bomb', 'hammer', 'hammer', 'slow', 'slow', 'pick', 'double', 'revive'];
      var got = pool[Math.floor(Math.random() * pool.length)];
      wallet.items[got] = (wallet.items[got] || 0) + 1;
      saveWallet(); renderWallet();
      sessionChest = true;
      setTimeout(function(){
        showBoardPop('🎁 보물상자!', ITEMS[got].ico + ' ' + ITEMS[got].name + ' 획득!', 'perfect');
        var ctxB = ensureAudio();
        if (ctxB && soundOn){ var t = ctxB.currentTime + 0.02; ['G5', 'C6', 'E6', 'G6'].forEach(function(nm, i){ playTone(ctxB, NOTE_FREQ[nm], t + i * 0.08, i === 3 ? 0.4 : 0.12, null, 0.09); }); }
      }, 500);
    }
  }

  function clearLines(){
    var cleared = 0;
    var fxRows = [];
    for (var fr = 0; fr < ROWS; fr++){
      if (grid[fr].every(function(v){ return v; })) fxRows.push({ r: fr, colors: grid[fr].slice() });
    }
    if (fxRows.length){
      fxRows.forEach(function(fr2){ fr2.colors = fr2.colors.map(function(v){ return isSpecialCell(v) ? '#ffcc33' : v; }); });
      if (typeof spawnLineFx === 'function') spawnLineFx(fxRows);
      handleSpecialCells(fxRows.map(function(fr2){ return fr2.r; }));
    }
    for (var r = ROWS - 1; r >= 0; r--){
      if (grid[r].every(function(v){ return v; })){
        grid.splice(r, 1);
        grid.unshift(new Array(COLS).fill(null));
        cleared++;
        r++;
      }
    }
    if (cleared === 0){ combo = 0; }
    if (cleared > 0){
      combo++;
      if (combo > maxComboThisGame) maxComboThisGame = combo;
      if (cleared >= 4) sessionTetris = true;
      var points = [0, 40, 100, 300, 1200][cleared] * level;
      var comboBonus = combo >= 2 ? 50 * (combo - 1) * level : 0;
      points += comboBonus;
      var perfect = grid.every(function(row){ return row.every(function(v){ return !v; }); });
      if (perfect){
        sessionPerfect = true;
        var perfectBonus = 1000 * level;
        points += perfectBonus;
        score += points;
        playTetrisSound(combo + 2);
        shakeBoard();
        showBoardPop('완벽 클리어!', '✨ +' + fmt(points), 'perfect');
        earn(3000, '완벽 클리어');
      } else if (cleared >= 4){
        var luckyX2 = stageOf(level) === 'lucky';
        if (luckyX2) points *= 2;
        score += points;
        playTetrisSound(combo);
        shakeBoard();
        showBoardPop('테트리스!!', (luckyX2 ? '🌈 2배! ' : '') + (combo >= 2 ? combo + '콤보 · ' : '') + '+' + fmt(points), 'tetris');
        earn(luckyX2 ? 2000 : 1000, luckyX2 ? '테트리스 2배' : '테트리스');
      } else {
        score += points;
        playLineClearSound(cleared, combo);
        if (combo >= 2) showBoardPop(combo + '콤보!', '+' + fmt(points), 'combo');
      }
      linesCleared += cleared;
      totalLines += cleared;
      try { localStorage.setItem('tetris_total_lines', String(totalLines)); } catch(e){}
      var oldLevel = level;
      level = levelFromLines(linesCleared);
      dropInterval = speedForLevel(level);
      scoreVal.textContent = fmt(score);
      levelVal.textContent = level;
      nextLevelVal.textContent = linesToNext();
      flashLinesBox(cleared);
      checkBadges();
      if (score > best){
        best = score;
        bestVal.textContent = fmt(best);
        try { localStorage.setItem('tetris_best', String(best)); } catch(e){}
      }
      if (level > bestLevel){
        bestLevel = level;
        bestLevelVal.textContent = bestLevel;
        try { localStorage.setItem('tetris_best_level', String(bestLevel)); } catch(e){}
      }
      if (level > oldLevel){
        if (cleared >= 4 || combo >= 2 || perfect){
          // 콤보·테트리스 연출을 먼저 보여 준 뒤 레벨업 화면
          celebrating = true;
          var lvFrom = oldLevel, lvTo = level;
          setTimeout(function(){ if (!gameOver) triggerLevelUp(lvFrom, lvTo); }, (cleared >= 4 || perfect) ? 1250 : 800);
        } else {
          triggerLevelUp(oldLevel, level);
        }
      }
      if (navigator.vibrate && level <= oldLevel) navigator.vibrate(cleared >= 4 ? [30,40,30] : 20);
    }
    return cleared;
  }

  function tryMove(dx, dy){
    if (!running || paused || gameOver || celebrating) return false;
    if (!collide(current.cells, current.x + dx, current.y + dy)){
      current.x += dx;
      current.y += dy;
      if (dx !== 0) playMoveSound();
      draw();
      return true;
    }
    return false;
  }

  function tryRotate(){
    if (!running || paused || gameOver || celebrating) return;
    var rotated = rotateCells(current.cells);
    var kicks = [0, -1, 1, -2, 2];
    for (var i = 0; i < kicks.length; i++){
      if (!collide(rotated, current.x + kicks[i], current.y)){
        current.cells = rotated;
        current.x += kicks[i];
        playRotateSound();
        draw();
        return;
      }
    }
  }

  function hardDrop(){
    if (!running || paused || gameOver || celebrating) return;
    var dist = 0;
    while (!collide(current.cells, current.x, current.y + 1)){
      current.y++;
      dist++;
    }
    score += dist * 2;
    scoreVal.textContent = fmt(score);
    lockPiece(true);
    draw();
    resetDropTimer();
  }

  function softDropStep(){
    if (!running || paused || gameOver || celebrating) return;
    if (!tryMove(0, 1)){
      lockPiece();
    } else {
      score += 1;
      scoreVal.textContent = fmt(score);
    }
  }

  function ghostY(){
    var gy = current.y;
    while (!collide(current.cells, current.x, gy + 1)) gy++;
    return gy;
  }

  function draw(){
    var th = currentTheme();
    ctx.fillStyle = th.bg || getCss('--panel');
    var W = COLS * cell, H = ROWS * cell;
    ctx.fillRect(0, 0, W, H);

    // 격자선: 실제 화소 1칸 두께로 딱 맞춰 그려 번짐 없이
    var scale = canvas.width / W;
    var lw = Math.max(1, Math.round(scale)) / scale;
    ctx.fillStyle = th.grid || getCss('--grid-line');
    for (var gx = 1; gx < COLS; gx++){
      ctx.fillRect(Math.round(gx * cell * scale) / scale, 0, lw, H);
    }
    for (var gyy = 1; gyy < ROWS; gyy++){
      ctx.fillRect(0, Math.round(gyy * cell * scale) / scale, W, lw);
    }

    for (var r = 0; r < ROWS; r++){
      for (var c = 0; c < COLS; c++){
        if (grid[r][c]) drawCell(ctx, c, r, grid[r][c]);
      }
    }

    if (current){
      var gy = ghostY();
      for (var i = 0; i < current.cells.length; i++){
        var cx = current.cells[i][0] + current.x;
        var cyy = current.cells[i][1] + gy;
        if (cyy >= 0) drawCell(ctx, cx, cyy, null, true);
      }
      for (var j = 0; j < current.cells.length; j++){
        var px = current.cells[j][0] + current.x;
        var py = current.cells[j][1] + current.y;
        if (py >= 0) drawCell(ctx, px, py, current.color);
      }
    }
  }

  function drawCell(context, x, y, color, ghost){
    var pad = 2;
    if (!ghost && isSpecialCell(color)){
      drawSpecialCell(context, x * cell + pad, y * cell + pad, cell - pad*2, color.slice(1));
      return;
    }
    if (ghost){
      context.strokeStyle = currentTheme().ghost || getCss('--ghost');
      context.lineWidth = 2;
      context.strokeRect(x * cell + pad, y * cell + pad, cell - pad*2, cell - pad*2);
      return;
    }
    paintBlock(context, x * cell + pad, y * cell + pad, cell - pad*2, color, curSkin());
  }

  function drawSpecialCell(c, px, py, s, kind){
    c.save();
    c.fillStyle = GARBAGE_COLOR; c.fillRect(px, py, s, s);
    var cx = px + s / 2, cy = py + s / 2, r = s * 0.38;
    var pulse = 0.5 + 0.5 * Math.sin(performance.now() / 250);
    if (kind === 'coin'){
      var g = c.createRadialGradient(cx - r * 0.3, cy - r * 0.3, r * 0.1, cx, cy, r);
      g.addColorStop(0, '#fff6b8'); g.addColorStop(0.6, '#ffc93c'); g.addColorStop(1, '#c98a00');
      c.fillStyle = g; c.beginPath(); c.arc(cx, cy, r, 0, Math.PI * 2); c.fill();
      c.strokeStyle = '#a86f00'; c.lineWidth = Math.max(1, s * 0.06);
      c.beginPath(); c.arc(cx, cy, r * 0.68, 0, Math.PI * 2); c.stroke();
      c.fillStyle = '#a86f00'; c.font = '900 ' + Math.round(s * 0.42) + 'px sans-serif';
      c.textAlign = 'center'; c.textBaseline = 'middle'; c.fillText('₩', cx, cy + s * 0.02);
      c.globalAlpha = 0.35 + 0.4 * pulse; c.fillStyle = '#fff';
      c.beginPath(); c.arc(cx - r * 0.4, cy - r * 0.45, r * 0.18, 0, Math.PI * 2); c.fill();
    } else if (kind === 'chest'){
      var w = s * 0.8, h = s * 0.62, x0 = cx - w / 2, y0 = cy - h / 2 + s * 0.04;
      c.fillStyle = '#8b5a2b'; c.fillRect(x0, y0, w, h);
      c.fillStyle = '#a86b33'; c.fillRect(x0, y0, w, h * 0.38);
      c.fillStyle = '#ffcc33'; c.fillRect(x0, y0 + h * 0.34, w, h * 0.12);
      c.fillRect(cx - s * 0.07, y0 + h * 0.28, s * 0.14, h * 0.3);
      c.strokeStyle = '#5a3713'; c.lineWidth = Math.max(1, s * 0.05); c.strokeRect(x0, y0, w, h);
      c.globalAlpha = 0.25 + 0.5 * pulse; c.fillStyle = '#fff3a0';
      c.beginPath(); c.arc(px + s * 0.82, py + s * 0.18, s * 0.09, 0, Math.PI * 2); c.fill();
    } else if (kind === 'bomb'){
      c.fillStyle = '#26262b'; c.beginPath(); c.arc(cx, cy + s * 0.06, r * 0.95, 0, Math.PI * 2); c.fill();
      c.fillStyle = 'rgba(255,255,255,0.35)'; c.beginPath(); c.arc(cx - r * 0.35, cy - r * 0.2, r * 0.25, 0, Math.PI * 2); c.fill();
      c.fillStyle = '#555'; c.fillRect(cx + r * 0.3, cy - r * 0.95, s * 0.14, s * 0.14);
      c.strokeStyle = '#a0784a'; c.lineWidth = Math.max(1, s * 0.06);
      c.beginPath(); c.moveTo(cx + r * 0.45, cy - r * 0.95); c.quadraticCurveTo(cx + r * 0.9, cy - r * 1.4, cx + r * 1.05, cy - r * 1.05); c.stroke();
      c.fillStyle = pulse > 0.5 ? '#ffdd33' : '#ff6a2a';
      c.beginPath(); c.arc(cx + r * 1.05, cy - r * 1.05, s * 0.08 + s * 0.04 * pulse, 0, Math.PI * 2); c.fill();
    }
    c.restore();
  }

  /* 블록 스킨별 그리기 (px,py: 왼쪽 위, s: 한 변 길이) */
  function shade(hex, amt){
    var m = /^#?([0-9a-f]{6})$/i.exec((hex || '').trim());
    if (!m) return hex;
    var n = parseInt(m[1], 16), r = (n >> 16) & 255, g = (n >> 8) & 255, b = n & 255;
    function f(v){ return Math.max(0, Math.min(255, Math.round(amt > 0 ? v + (255 - v) * amt : v * (1 + amt)))); }
    return 'rgb(' + f(r) + ',' + f(g) + ',' + f(b) + ')';
  }
  function roundRectPath(c, x, y, w, h, r){
    c.beginPath();
    c.moveTo(x + r, y); c.lineTo(x + w - r, y); c.quadraticCurveTo(x + w, y, x + w, y + r);
    c.lineTo(x + w, y + h - r); c.quadraticCurveTo(x + w, y + h, x + w - r, y + h);
    c.lineTo(x + r, y + h); c.quadraticCurveTo(x, y + h, x, y + h - r);
    c.lineTo(x, y + r); c.quadraticCurveTo(x, y, x + r, y); c.closePath();
  }
  function paintBlock(c, px, py, s, color, skin){
    c.save();
    if (skin === 'gem'){
      var g = c.createLinearGradient(px, py, px + s, py + s);
      g.addColorStop(0, shade(color, 0.45)); g.addColorStop(0.5, color); g.addColorStop(1, shade(color, -0.35));
      c.fillStyle = g; c.fillRect(px, py, s, s);
      var q = s * 0.22;
      c.fillStyle = shade(color, 0.25);
      c.beginPath(); c.moveTo(px, py); c.lineTo(px + s, py); c.lineTo(px + s - q, py + q); c.lineTo(px + q, py + q); c.closePath(); c.fill();
      c.fillStyle = shade(color, -0.3);
      c.beginPath(); c.moveTo(px, py + s); c.lineTo(px + s, py + s); c.lineTo(px + s - q, py + s - q); c.lineTo(px + q, py + s - q); c.closePath(); c.fill();
      c.fillStyle = 'rgba(255,255,255,0.75)';
      c.beginPath(); c.moveTo(px + s*0.3, py + s*0.28); c.lineTo(px + s*0.42, py + s*0.28); c.lineTo(px + s*0.3, py + s*0.42); c.closePath(); c.fill();
    } else if (skin === 'candy'){
      var r = s * 0.28;
      roundRectPath(c, px, py, s, s, r);
      var g2 = c.createLinearGradient(px, py, px, py + s);
      g2.addColorStop(0, shade(color, 0.3)); g2.addColorStop(1, shade(color, -0.15));
      c.fillStyle = g2; c.fill();
      c.clip();
      c.strokeStyle = 'rgba(255,255,255,0.35)'; c.lineWidth = s * 0.14;
      for (var k = -1; k < 3; k++){ c.beginPath(); c.moveTo(px + k * s * 0.5, py + s); c.lineTo(px + k * s * 0.5 + s, py); c.stroke(); }
      c.fillStyle = 'rgba(255,255,255,0.55)';
      roundRectPath(c, px + s*0.15, py + s*0.1, s*0.7, s*0.22, s*0.11); c.fill();
    } else if (skin === 'neon'){
      c.fillStyle = 'rgba(10,10,25,0.85)'; c.fillRect(px, py, s, s);
      c.shadowColor = color; c.shadowBlur = s * 0.5;
      c.strokeStyle = shade(color, 0.35); c.lineWidth = Math.max(1.5, s * 0.1);
      c.strokeRect(px + s*0.12, py + s*0.12, s*0.76, s*0.76);
      c.shadowBlur = 0;
      c.fillStyle = shade(color, 0.1); c.globalAlpha = 0.35;
      c.fillRect(px + s*0.3, py + s*0.3, s*0.4, s*0.4);
    } else {
      c.fillStyle = color; c.fillRect(px, py, s, s);
      c.fillStyle = 'rgba(255,255,255,0.18)'; c.fillRect(px, py, s, s * 0.3);
    }
    c.restore();
  }

  function drawNext(){
    nextCtx.clearRect(0, 0, 64, 64);
    var nc = 14;
    var offX = (64 - 4*nc) / 2;
    var offY = (64 - 4*nc) / 2;
    for (var i = 0; i < next.cells.length; i++){
      var x = next.cells[i][0], y = next.cells[i][1];

    var cells = SHAPES[holdType];
    var nc = 14;
    var minX = 4, maxX = -1, minY = 4, maxY = -1;
    cells.forEach(function(p){ minX = Math.min(minX, p[0]); maxX = Math.max(maxX, p[0]); minY = Math.min(minY, p[1]); maxY = Math.max(maxY, p[1]); });
    var offX = (64 - (maxX - minX + 1) * nc) / 2 - minX * nc;
    var offY = (64 - (maxY - minY + 1) * nc) / 2 - minY * nc;
    cells.forEach(function(p){ paintBlock(holdCtx, offX + p[0]*nc + 1, offY + p[1]*nc + 1, nc - 2, COLORS[holdType], curSkin()); });

  function bindHold(el, fn, repeatMs){
    var timer = null;
    function start(e){
      e.preventDefault();
      fn();
      timer = setInterval(fn, repeatMs);
    }
    function stop(){
      if (timer){ clearInterval(timer); timer = null; }
    }
    el.addEventListener('touchstart', start, {passive:false});
    el.addEventListener('touchend', stop);
    el.addEventListener('touchcancel', stop);
    el.addEventListener('mousedown', start);
    el.addEventListener('mouseup', stop);
    el.addEventListener('mouseleave', stop);
  }

  // 한 번 누를 때 한 번만 실행 (누르고 있어도 반복 없음). minGap(ms) 안에 다시 눌리면 무시
  function bindSingle(el, fn, minGap){
    var lastPress = 0, pressing = false;
    function press(e){
      e.preventDefault();
      if (pressing) return;
      pressing = true;
      var now = performance.now();
      if (now - lastPress < minGap) return;
      lastPress = now;
      fn();
    }
    function release(){ pressing = false; }
    el.addEventListener('touchstart', press, {passive:false});
    el.addEventListener('touchend', release);
    el.addEventListener('touchcancel', release);
    el.addEventListener('mousedown', press);
    el.addEventListener('mouseup', release);
    el.addEventListener('mouseleave', release);
  }
  // 좌우 버튼: 누르고 있어도 한 칸만. 빠르게 톡톡 누르는 건 그대로 되도록 간격 제한은 아주 짧게(0.05초)
  bindSingle(document.getElementById('btnLeft'), function(){ tryMove(-1, 0); }, 50);

  (function(){
    var el = document.getElementById('btnDown');
    var lastPress = 0, pressing = false;
    function press(e){
      e.preventDefault();
      if (pressing) return;
      pressing = true;
      var now = performance.now();
      if (now - lastPress < 200) return;
      lastPress = now;
      softDropStep(); draw();
    }
    function release(){ pressing = false; }
    el.addEventListener('touchstart', press, {passive:false});
    el.addEventListener('touchend', release);
    el.addEventListener('touchcancel', release);
    el.addEventListener('mousedown', press);
    el.addEventListener('mouseup', release);
    el.addEventListener('mouseleave', release);
  })();

  /* 화면 터치 조작: 끌어서 이동, 톡 치면 회전, 아래로 빠르게 쓸면 즉시 내리기 */
  var touch = null;
  function canPlay(){ return running && !paused && !gameOver && !celebrating && current; }
  canvas.addEventListener('pointerdown', function(e){
    if (hammerMode){
      e.preventDefault();
      var rc = canvas.getBoundingClientRect();
      var hc = Math.floor((e.clientX - rc.left) / (rc.width / COLS));
      var hr = Math.floor((e.clientY - rc.top) / (rc.height / ROWS));
      useHammerAt(hc, hr);
      return;
    }
    if (!canPlay()) return;
    e.preventDefault();
    try { canvas.setPointerCapture(e.pointerId); } catch(err){}
    touch = { id: e.pointerId, sx: e.clientX, sy: e.clientY, ax: e.clientX, ay: e.clientY,
              t: performance.now(), moved: false, dropped: 0, piece: current, axis: null };
  });
  canvas.addEventListener('pointermove', function(e){
    if (!touch || e.pointerId !== touch.id || !canPlay()) return;
    e.preventDefault();
    if (current !== touch.piece){ touch = null; return; } // 블록이 바닥에 닿으면 다음 블록은 새로 잡아야 함
    var step = cell;
    // 처음 움직인 방향으로 고정: 세로로 쓸면 옆으로 안 가고, 가로로 끌면 아래로 안 감
    if (!touch.axis){
      var ddx = e.clientX - touch.sx, ddy = e.clientY - touch.sy;
      if (Math.max(Math.abs(ddx), Math.abs(ddy)) < 12) return;
      touch.axis = Math.abs(ddy) > Math.abs(ddx) ? 'v' : 'h';
      touch.ax = touch.sx; touch.ay = touch.sy;
    }
    if (touch.axis === 'h'){
      var dx = e.clientX - touch.ax;
      while (dx >= step){ tryMove(1, 0); touch.ax += step; dx -= step; touch.moved = true; }
      while (dx <= -step){ tryMove(-1, 0); touch.ax -= step; dx += step; touch.moved = true; }
    } else {
      var dy = e.clientY - touch.ay;
      while (dy >= step){
        softDropStep(); draw();
        touch.ay += step; dy -= step; touch.moved = true; touch.dropped++;
        if (!canPlay()) break;
      }
    }
  });
  function endTouch(e){
    if (!touch || e.pointerId !== touch.id) return;
    var t = touch; touch = null;
    if (!canPlay() || current !== t.piece) return;
    var totalX = e.clientX - t.sx, totalY = e.clientY - t.sy;
    var dt = performance.now() - t.t;
    if (!t.moved && Math.abs(totalX) < 10 && Math.abs(totalY) < 10 && dt < 350){
      tryRotate();
    } else if (t.axis === 'v' && totalY > cell * 2.5 && dt < 250){
      hardDrop();
    } else if (t.axis === 'v' && totalY < -cell * 2){
      doHold();
    }
  }
  canvas.addEventListener('pointerup', endTouch);
  canvas.addEventListener('pointercancel', function(){ touch = null; });

          for (var j = 0; j < 2; j++){
            particles.push({ k: 'star', x: cx + (Math.random() - 0.5) * L.cw, y: cy, vx: (Math.random() - 0.5) * 50, vy: -40 - Math.random() * 90, g: -10,
              life: 0, max: 0.8 + Math.random() * 0.5, size: L.cw * (0.22 + Math.random() * 0.18), rot: Math.random() * 6, vr: (Math.random() - 0.5) * 6,
              color: Math.random() < 0.6 ? '#ffe066' : '#ffffff' });
          }
        } else if (kind === 'heart'){
          if (Math.random() < 0.85){
            particles.push({ k: 'heart', x: cx, y: cy, vx: 0, vy: -50 - Math.random() * 60, g: -15, sway: Math.random() * 6, swayAmp: 12 + Math.random() * 14,
              life: 0, max: 0.9 + Math.random() * 0.5, size: L.cw * (0.28 + Math.random() * 0.2),
              color: FX_PINK[Math.floor(Math.random() * FX_PINK.length)] });
          }
        }
      }
    });
    if (particles.length > 500) particles.splice(0, particles.length - 500);
    if (!fxRunning){ fxRunning = true; fxLastT = performance.now(); requestAnimationFrame(fxLoop); }
  }
  function spawnCellFx(cells, kind){
    var L = layoutFx();
    cells.forEach(function(rc){
      var cx = (rc[1] + 0.5) * L.cw, cy = (rc[0] + 0.5) * L.ch;
      for (var i = 0; i < 4; i++){
        var a = Math.random() * Math.PI * 2, sp = 80 + Math.random() * 200;
        particles.push({ k: 'spark', x: cx, y: cy, vx: Math.cos(a) * sp, vy: Math.sin(a) * sp - 80, g: 380,
          life: 0, max: 0.5 + Math.random() * 0.4, size: 2 + Math.random() * 2.5,
          color: FX_WARM[Math.floor(Math.random() * FX_WARM.length)] });
      }
    });
    if (particles.length > 600) particles.splice(0, particles.length - 600);
    if (!fxRunning){ fxRunning = true; fxLastT = performance.now(); requestAnimationFrame(fxLoop); }
  }
  function drawStar(c, x, y, r, rot){
    c.beginPath();
    for (var i = 0; i < 10; i++){
      var rr = i % 2 === 0 ? r : r * 0.45, a = rot + i * Math.PI / 5 - Math.PI / 2;
      c.lineTo(x + Math.cos(a) * rr, y + Math.sin(a) * rr);
    }
    c.closePath(); c.fill();
  }
  function drawHeart(c, x, y, s){
    c.beginPath();
    c.moveTo(x, y + s * 0.35);
    c.bezierCurveTo(x - s * 1.1, y - s * 0.35, x - s * 0.45, y - s * 1.05, x, y - s * 0.45);
    c.bezierCurveTo(x + s * 0.45, y - s * 1.05, x + s * 1.1, y - s * 0.35, x, y + s * 0.35);
    c.closePath(); c.fill();
  }
  function fxLoop(t){
    var dt = Math.min((t - fxLastT) / 1000, 0.05); fxLastT = t;
    var w = fxCanvas.clientWidth, h = fxCanvas.clientHeight;
    fxCtx.clearRect(0, 0, w, h);
    for (var i = particles.length - 1; i >= 0; i--){
      var p = particles[i];
      p.life += dt;
      if (p.life >= p.max){ particles.splice(i, 1); continue; }
      p.vy += p.g * dt; p.x += p.vx * dt; p.y += p.vy * dt;
      var k = p.life / p.max, alpha = 1 - k;
      fxCtx.globalAlpha = Math.max(0, alpha);
      fxCtx.fillStyle = p.color;
      if (p.k === 'spark'){
        fxCtx.globalCompositeOperation = 'lighter';
        fxCtx.beginPath(); fxCtx.arc(p.x, p.y, p.size * (1 - k * 0.5), 0, Math.PI * 2); fxCtx.fill();
        fxCtx.globalCompositeOperation = 'source-over';
      } else if (p.k === 'star'){
        p.rot += p.vr * dt;
        fxCtx.globalAlpha = Math.max(0, alpha) * (0.6 + 0.4 * Math.abs(Math.sin(p.life * 14)));
        drawStar(fxCtx, p.x, p.y, p.size, p.rot);
      } else if (p.k === 'heart'){
        var sx = p.x + Math.sin(p.life * 5 + p.sway) * p.swayAmp;
        drawHeart(fxCtx, sx, p.y, p.size * (0.7 + 0.3 * Math.min(1, p.life * 4)));
      }
    }
    fxCtx.globalAlpha = 1;
    if (particles.length){ requestAnimationFrame(fxLoop); }
    else { fxRunning = false; fxCtx.clearRect(0, 0, w, h); }
  }
  function previewFx(k){
    // 상점 위에서도 보이도록 게임판 가운데 두 줄에서 효과 재생
    var colors = KEYS.map(function(key){ return COLORS[key]; });
    var rowsArr = [{ r: 9, colors: [] }, { r: 10, colors: [] }];
    rowsArr.forEach(function(rw){ for (var c = 0; c < COLS; c++) rw.colors.push(colors[c % colors.length]); });
    fxCanvas.style.zIndex = 30;
    spawnLineFx(rowsArr, k);
    setTimeout(function(){ fxCanvas.style.zIndex = ''; }, 1500);
  }
  function previewSfx(k){
    var ctxA = ensureAudio();
    if (!ctxA) return;
    var prev = wallet.sfx; wallet.sfx = k;
    var t = ctxA.currentTime + 0.03;
    ['C5', 'E5', 'G5', 'C6'].forEach(function(nm, i){ playTone(ctxA, NOTE_FREQ[nm], t + i * 0.07, i === 3 ? 0.3 : 0.13, null, 0.085); });
    wallet.sfx = prev;
  }

  renderWallet();
  refreshLook();
  if (starterJustGiven){
    setTimeout(function(){ showBadgeToast('기본 아이템 4개 지급! 💣🔨🐢🎯'); }, 800);
  }

  window.addEventListener('resize', resize);

  grid = newGrid();
  applyLevelTheme(1);
  renderStartStats();
  resize();
  requestAnimationFrame(loop);
})();
</script>
